<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Sync - Preferences</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_box,explore,home,settings" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <!-- Include CSS style sheet related to current page -->
    <link rel="stylesheet" href="../css/settings-preferences.css">
    <!-- CSS style sheet ends here -->
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="sidebar d-flex flex-column bg-light col-2 vh-100 p-4">
                <header class="d-flex flex-column align-items-start justify-content-start flex-grow-1 w-100">
                    <h4 class="text-center fw-bolder mb-3 w-100">Food Sync</h4>
                    <ul class="nav flex-column w-100">
                        <li class="nav-item"><a class="nav-link" href="../index.html">
                            <span class="material-symbols-rounded nav-link-icon">home</span>Home</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="../explore.html">
                            <span class="material-symbols-rounded nav-link-icon">explore</span>Explore</a>
                        </li>
                        <li class="nav-item"><a class="nav-link" href="../profile.html">
                            <span class="material-symbols-rounded nav-link-icon">account_box</span>Profile</a>
                        </li>
                        <li class="nav-item"><a class="nav-link active" href="../settings.html">
                            <span class="material-symbols-rounded nav-link-icon">settings</span>Settings</a>
                        </li>
                    </ul>
                </header>

                <footer class="d-flex flex-column align-items-start justify-content-end flex-grow-1 w-100">
                    <ul class="nav flex-column w-100">
                        <li class="nav-item"><a class="nav-link text-center" href="">Sign Out</a></li>
                    </ul>
                </footer>
            </nav>

            <main class="content d-flex flex-column align-items-center justify-content-start overflow-x-hidden overflow-y-hidden col-10 m-0 p-0">
                <div class="d-flex flex-column align-items-center justify-content-start overflow-auto w-100 px-4 pt-4">
                    
                    <h2 class="mb-3">Preferences</h2>

                    <div class="d-flex justify-content-between align-items-center mb-3 w-50 py-2 border-bottom">
                        <label for="dropdown-theme" class="form-label fw-semibold mb-0">Theme</label>
                        
                        <div class="dropdown">
                            <button
                                    type="button"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                    id="dropdown-theme">
                            Light
                            </button>
                            <ul class="dropdown-menu w-25"  aria-labelledby="dropdown-theme">
                            <li><a class="dropdown-item" href="#" onclick="setTheme('Light')">Light</a></li>
                            <li><a class="dropdown-item" href="#" onclick="setTheme('Dark')">Dark</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3 w-50 py-2 border-bottom">
                        <label for="dropdown-units" class="form-label fw-semibold">Measurement Units</label>
                        <div class="dropdown">
                            <button 
                                    type="button" 
                                    data-bs-toggle="dropdown" 
                                    aria-expanded="false" 
                                    id="dropdown-units">
                            Imperial
                            </button>
                            <ul class="dropdown-menu w-25" aria-labelledby="dropdown-units">
                            <li><a class="dropdown-item" href="#" onclick="setUnits('Imperial')">Imperial</a></li>
                            <li><a class="dropdown-item" href="#" onclick="setUnits('Metric')">Metric</a></li>
                            </ul>
                        </div>
                    </div>
                    
                </div>
            </main>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function setTheme(theme) {
            document.getElementById('dropdown-theme').textContent = theme;
            // Implement theme change
        }

        function setUnits(unit) {
            document.getElementById('dropdown-units').textContent = unit;
            // Implement unit change
        }
    </script>
</body>

</html>
